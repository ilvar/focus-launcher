# Focus launcher: landing page + APK download, served at https://how2me.me/focusapp/
#
# Installed as /etc/nginx/snippets/focusapp.conf and pulled into the how2me.me server block with
#     include snippets/focusapp.conf;
# The files live in /var/www/focusapp, outside the main site's root, so redeploying the main site
# can never wipe them. "^~" makes this prefix win over the server's regex locations.

location = /focusapp { return 301 /focusapp/; }

# how2me.me had no robots.txt. This one restricts nothing ("Allow: /"); it exists so crawlers can
# find https://how2me.me/focusapp/sitemap.xml. If the main site ever wants its own robots.txt,
# delete this block and keep the Sitemap: line in the new file.
location = /robots.txt {
    root /var/www/focusapp;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /focusapp/ {
    root /var/www;                      # /focusapp/x  ->  /var/www/focusapp/x
    index index.html;
    try_files $uri $uri/ =404;

    # add_header in a location replaces the server's headers instead of adding to them,
    # so the two the main site sets are repeated here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The page is plain HTML and one stylesheet: no scripts, no inline styles, nothing third-party.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache";

    location ~* \.apk$ {
        root /var/www;
        types { }                       # nginx 1.18 does not know .apk; force the right type
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. { deny all; }
}
