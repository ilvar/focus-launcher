org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# No JDK path in here: this file is the same for everybody (your machine, CI, F-Droid's build
# server). Gradle 8.14 needs JDK 17-21. If your default `java` is newer, point Gradle at one:
#   ./gradlew -Dorg.gradle.java.home=/path/to/jdk-21 ...     (or set JAVA_HOME)

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
