name: F-Droid

# Run by hand (Actions -> F-Droid -> Run workflow). Nothing here runs on its own.
#
# F-Droid does not take uploads. It builds every app itself from a recipe that lives in its own
# repository (gitlab.com/fdroid/fdroiddata), and the recipe gets there as a merge request. After
# it is accepted, F-Droid finds new versions by itself from this repository's tags.
#
#   check   fills fdroid/com.focus.launcher.yml for a tag and runs F-Droid's own tools on it, in
#           F-Droid's build container: readmeta, rewritemeta, checkupdates, lint and, if asked,
#           the full build, which also proves that the build is identical to the published APK.
#   submit  only when asked to, and only with the owner's GitLab token: commits the recipe to a
#           branch of the owner's fdroiddata fork and opens the merge request. It waits for the
#           owner's approval first (environment "release"), like everything that uses a secret.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.25. Empty = the newest vX.Y.Z tag."
        required: false
        default: ""
      build:
        description: "Also build it the way F-Droid does and compare with the published APK (about 20 minutes)"
        type: boolean
        default: true
      submit:
        description: "Open the merge request on GitLab (needs FDROID_GITLAB_TOKEN and FDROID_GITLAB_FORK)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fdroid
  cancel-in-progress: false

env:
  APP_ID: com.focus.launcher

jobs:
  check:
    name: Check the recipe with F-Droid's tools
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Which release
        id: tag
        env:
          WANTED: ${{ inputs.tag }}
        run: |
          tag="$WANTED"
          [ -n "$tag" ] || tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.([0-9]+))$ ]] || { echo "::error::'$tag' is not a vX.Y.Z tag"; exit 1; }
          version="${BASH_REMATCH[1]}"; code="${BASH_REMATCH[2]}"
          commit=$(git rev-list -n 1 "$tag")
          count=$(git rev-list --count "$commit")
          # The build number in the tag has to be what the build computes at that commit.
          [ "$count" = "$code" ] || { echo "::error::tag $tag says build $code, but the commit count there is $count"; exit 1; }
          { echo "tag=$tag"; echo "version=$version"; echo "code=$code"; echo "commit=$commit"; } >> "$GITHUB_OUTPUT"
          echo "release $tag = version $version, code $code, commit $commit"

      - name: The listing F-Droid reads from this repository
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CODE: ${{ steps.tag.outputs.code }}
        run: |
          dir=fastlane/metadata/android/en-US
          status=0
          need() { git cat-file -e "$TAG:$1" 2>/dev/null || { echo "::error::$1 is missing at $TAG"; status=1; }; }
          need LICENSE; need "$dir/title.txt"; need "$dir/short_description.txt"; need "$dir/full_description.txt"; need "$dir/images/icon.png"
          short=$(git show "$TAG:$dir/short_description.txt" | tr -d '\n')
          [ "${#short}" -lt 80 ] || { echo "::error::short_description.txt has ${#short} characters; it must be under 80"; status=1; }
          case "$short" in *.) echo "::error::short_description.txt must not end with a dot"; status=1 ;; esac
          full=$(git show "$TAG:$dir/full_description.txt" | wc -c)
          [ "$full" -le 4000 ] || { echo "::error::full_description.txt has $full characters; the limit is 4000"; status=1; }
          if git cat-file -e "$TAG:$dir/changelogs/$CODE.txt" 2>/dev/null; then
            log=$(git show "$TAG:$dir/changelogs/$CODE.txt" | wc -c)
            [ "$log" -le 500 ] || { echo "::error::changelogs/$CODE.txt has $log characters; the limit is 500"; status=1; }
          else
            echo "::warning::no changelogs/$CODE.txt at $TAG: F-Droid will show no 'what is new' for this version"
          fi
          exit $status

      - name: Fill in the recipe
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CODE: ${{ steps.tag.outputs.code }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/recipe"
          sed -e "s/@VERSION_NAME@/$VERSION/g" -e "s/@VERSION_CODE@/$CODE/g" -e "s/@COMMIT@/$COMMIT/g" \
            "fdroid/$APP_ID.yml" > "$RUNNER_TEMP/recipe/$APP_ID.yml"
          ! grep -q '@' "$RUNNER_TEMP/recipe/$APP_ID.yml" || { echo "::error::a placeholder was left in the recipe"; exit 1; }
          cat "$RUNNER_TEMP/recipe/$APP_ID.yml"

      - name: F-Droid's data and tools
        run: |
          git clone --quiet --depth=1 https://gitlab.com/fdroid/fdroiddata.git "$RUNNER_TEMP/fdroiddata"
          git clone --quiet --depth=1 https://gitlab.com/fdroid/fdroidserver.git "$RUNNER_TEMP/fdroidserver"
          cp "$RUNNER_TEMP/recipe/$APP_ID.yml" "$RUNNER_TEMP/fdroiddata/metadata/$APP_ID.yml"
          # The container works as its own user; let it write where it has to.
          chmod -R a+rwX "$RUNNER_TEMP/fdroiddata" "$RUNNER_TEMP/fdroidserver"

      - name: readmeta, rewritemeta, checkupdates, lint${{ inputs.build && ', build' || '' }}
        env:
          BUILD: ${{ inputs.build }}
        run: |
          cat > "$RUNNER_TEMP/fdroiddata/run-checks.sh" <<'EOS'
          set -e
          . /etc/profile
          export PATH="$fdroidserver:$PATH" PYTHONPATH="$fdroidserver"
          export JAVA_HOME=$(java -XshowSettings:properties -version 2>&1 > /dev/null | grep 'java.home' | awk -F'=' '{print $2}' | tr -d ' ')
          cd /build
          echo "== fdroid readmeta";      fdroid readmeta
          echo "== fdroid rewritemeta";   fdroid rewritemeta "$APP_ID"
          echo "== fdroid checkupdates";  fdroid checkupdates --allow-dirty "$APP_ID"
          echo "== fdroid lint";          fdroid lint "$APP_ID"
          if [ "$BUILD" = "true" ]; then echo "== fdroid build"; fdroid build --verbose "$APP_ID"; fi
          EOS
          docker run --rm -u vagrant --entrypoint /bin/bash \
            -e APP_ID -e BUILD \
            -v "$RUNNER_TEMP/fdroiddata:/build:z" \
            -v "$RUNNER_TEMP/fdroidserver:/home/vagrant/fdroidserver:Z" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver /build/run-checks.sh

      - name: What F-Droid's tools made of the recipe
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          if ! diff -u "recipe/$APP_ID.yml" "fdroiddata/metadata/$APP_ID.yml"; then
            echo "::notice::rewritemeta or checkupdates changed the recipe (diff above). The changed version is the one that is kept."
          fi
          mkdir -p out && cp "fdroiddata/metadata/$APP_ID.yml" out/ && cp "$GITHUB_WORKSPACE/fdroid/MERGE_REQUEST.md" out/
          ls -l fdroiddata/unsigned fdroiddata/tmp 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fdroid-recipe
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 30

  submit:
    name: Open the merge request on GitLab
    needs: check
    if: inputs.submit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fdroid-recipe
          path: recipe

      - name: Commit the recipe to the fork and open the merge request
        env:
          GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          FORK: ${{ vars.FDROID_GITLAB_FORK }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          [ -n "$GITLAB_TOKEN" ] && [ -n "$FORK" ] || {
            echo "::error::FDROID_GITLAB_TOKEN (secret of the release environment) or FDROID_GITLAB_FORK (repository variable, like yourname/fdroiddata) is missing. See fdroid/README.md."
            exit 1; }
          api=https://gitlab.com/api/v4
          branch="$APP_ID"
          fork_id=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$FORK")
          call() { curl --fail-with-body -sS -H "PRIVATE-TOKEN: $GITLAB_TOKEN" "$@"; }
          upstream=$(call "$api/projects/fdroid%2Ffdroiddata" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          # One commit on a branch made from the fork's master: create the file, or update it on a re-run.
          if call "$api/projects/$fork_id/repository/files/metadata%2F$APP_ID.yml?ref=$branch" >/dev/null 2>&1; then action=update; start=""; else action=create; start=master; fi
          python3 - "$action" "$start" "$branch" "$VERSION" > payload.json <<'PY'
          import json, os, sys
          action, start, branch, version = sys.argv[1:5]
          app = os.environ["APP_ID"]
          body = {"branch": branch, "commit_message": f"New App: {app}" if action == "create" else f"{app}: recipe for {version}",
                  "actions": [{"action": action, "file_path": f"metadata/{app}.yml", "content": open(f"recipe/{app}.yml").read()}]}
          if start: body["start_branch"] = start
          print(json.dumps(body))
          PY
          call -X POST -H "Content-Type: application/json" --data @payload.json "$api/projects/$fork_id/repository/commits" >/dev/null
          echo "recipe committed to $FORK, branch $branch"

          existing=$(call "$api/projects/$upstream/merge_requests?state=opened&source_branch=$branch&author_username=${FORK%%/*}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['web_url'] if d else '')")
          if [ -n "$existing" ]; then echo "The merge request is already open: $existing"; echo "### Updated: $existing" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi

          python3 - "$upstream" "$branch" > mr.json <<'PY'
          import json, os, sys
          upstream, branch = sys.argv[1:3]
          text = open("recipe/MERGE_REQUEST.md").read() if os.path.exists("recipe/MERGE_REQUEST.md") else ""
          print(json.dumps({"source_branch": branch, "target_branch": "master", "target_project_id": int(upstream),
                            "title": "New app: Focus Launcher", "description": text, "allow_collaboration": True,
                            "remove_source_branch": True}))
          PY
          url=$(call -X POST -H "Content-Type: application/json" --data @mr.json "$api/projects/$fork_id/merge_requests" | python3 -c "import json,sys; print(json.load(sys.stdin)['web_url'])")
          echo "Merge request opened: $url"
          echo "### Merge request opened: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewers will ask questions there. Answer them on GitLab; this workflow can be run again to update the recipe." >> "$GITHUB_STEP_SUMMARY"
