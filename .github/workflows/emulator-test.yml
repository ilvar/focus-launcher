name: Emulator test

# Does the timer watcher work on a real Android system? Runs the debug build on an emulator and
# walks through a visit to an app whose one-minute limit runs out (see the script). It runs by
# hand, and for pull requests that touch the service, the manifest or this test: those are the
# changes that unit tests cannot vouch for. About ten minutes.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/focus/launcher/service/**'
      - 'app/src/main/java/com/focus/launcher/MainActivity.kt'
      - 'app/src/main/java/com/focus/launcher/BlockActivity.kt'
      - '.github/scripts/emulator-timer-test.sh'
      - '.github/workflows/emulator-test.yml'

permissions:
  contents: read

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timers:
    name: Timer watcher on Android ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build the debug APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleDebug

      # The runners can use hardware virtualization; without this the emulator takes forever.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Walk through a visit on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: .github/scripts/emulator-timer-test.sh
